<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- macOS Drop Shadow for the squircle icon -->
    <filter id="mac-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background squircle shape (macOS standard rounded rectangle with padding) -->
  <rect x="48" y="44" width="416" height="416" rx="96" fill="#ffffff" filter="url(#mac-shadow)" />
  
  <!-- Subtle border to make the white icon stand out on light backgrounds -->
  <rect x="48" y="44" width="416" height="416" rx="96" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Original black circle, scaled proportionally and centered in the squircle -->
  <circle cx="256" cy="252" r="104" fill="#000000" />
</svg>
